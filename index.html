      const SimulationContext = createContext(null);

      function calculateDynamicRisk(baseZone, rainMm) {
        const slopeFactor = baseZone.slope / 45;
        const dynamicMoisture = Math.min(99, Math.max(25, Math.round(35 + (rainMm / 200) * 58 * (1 + slopeFactor * 0.1))));
        const dynamicDisplacement = parseFloat(Math.max(0.5, (0.8 + Math.pow(rainMm / 40, 2) * 0.9 * slopeFactor)).toFixed(1));
        
        let score = Math.round(rainMm * 0.35 * slopeFactor + dynamicMoisture * 0.4 + dynamicDisplacement * 1.5);
        score = Math.min(100, Math.max(15, score));

        let level = 'LOW';
        if (score >= 85) level = 'CRITICAL';
        else if (score >= 65) level = 'HIGH';
        else if (score >= 35) level = 'MODERATE';

        let trigger = 'Baseline environmental metrics within seasonal threshold';
        if (level === 'CRITICAL') trigger = `Extreme rainfall saturation (${rainMm}mm) exceeding critical pore pressure limit on ${baseZone.slope}° slope`;
        else if (level === 'HIGH') trigger = `Heavy cumulative rainfall (${rainMm}mm) and accelerated ground creep (${dynamicDisplacement}mm)`;
        else if (level === 'MODERATE') trigger = `Moderate rainfall (${rainMm}mm) with rising soil water saturation`;

        return { riskScore: score, riskLevel: level, soilMoisture: dynamicMoisture, groundDisplacement: dynamicDisplacement, primaryTrigger: trigger };
      }

        const [activeZone, setActiveZone] = useState(MOCK_ZONES[0]);
        const [simulatedRainfall, setSimulatedRainfall] = useState(142);
        const [userCoords, setUserCoords] = useState(null);
        const [locationStatus, setLocationStatus] = useState('idle');
        const [locationMessage, setLocationMessage] = useState('Default demo location: Shillong Zone 04 (Meghalaya)');
        const [isEscalating, setIsEscalating] = useState(false);
        const [escalationStep, setEscalationStep] = useState('');
        const [showEmergencyModal, setShowEmergencyModal] = useState(false);
        const [showSafeAreasModal, setShowSafeAreasModal] = useState(false);
        const [citizenReports, setCitizenReports] = useState(() => {
          try {
            const saved = localStorage.getItem('ner_citizen_reports');
            if (saved) return [...JSON.parse(saved), ...INITIAL_REPORTS];
          } catch(e){}
          return INITIAL_REPORTS;
        });

        const navigateTo = useCallback((route) => {
          setCurrentRoute(route);
          window.location.hash = route;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, []);

        useEffect(() => {
          const onHashChange = () => setCurrentRoute(window.location.hash.replace('#', '') || '/');
          window.addEventListener('hashchange', onHashChange);
          return () => window.removeEventListener('hashchange', onHashChange);
        }, []);

        const dynamicMetrics = useMemo(() => {
          return calculateDynamicRisk(activeZone, simulatedRainfall);
        }, [activeZone, simulatedRainfall]);

        const playAlertTone = useCallback((isCritical) => {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = isCritical ? 'sawtooth' : 'sine';
            osc.frequency.setValueAtTime(isCritical ? 880 : 440, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(isCritical ? 440 : 220, ctx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
          } catch(e){}
        }, []);

        const requestUserLocation = useCallback(() => {
          setLocationStatus('loading');
          setLocationMessage('Requesting GPS location...');

          if (!navigator.geolocation) {
            setLocationStatus('denied');
            setLocationMessage('Geolocation unavailable. Using demo location: Shillong Zone 04.');
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const lat = pos.coords.latitude;
              const lng = pos.coords.longitude;
              setUserCoords([lat, lng]);
              setLocationStatus('granted');
              setLocationMessage(`GPS Active: ${lat.toFixed(4)}°N, ${lng.toFixed(4)}°E (Matched nearest demo zone: Shillong Zone 04)`);
              setActiveZone(MOCK_ZONES[0]);
              setSimulatedRainfall(MOCK_ZONES[0].rainfall24h);
            },
            () => {
              setLocationStatus('denied');
              setLocationMessage('GPS permission denied. Gracefully using demo location: Shillong Zone 04 (Meghalaya).');
              setActiveZone(MOCK_ZONES[0]);
            },
            { timeout: 8000 }
          );
        }, []);

        const runEscalationDemo = useCallback(() => {
          if (isEscalating) return;
          setIsEscalating(true);
          setEscalationStep('Initializing Demo Simulation: 40mm Rainfall (LOW Risk)...');
          setSimulatedRainfall(40);

          const t1 = setTimeout(() => {
            setSimulatedRainfall(80);
            setEscalationStep('Escalating: 80mm Rainfall (MODERATE Risk)...');
            playAlertTone(false);
          }, 3000);

          const t2 = setTimeout(() => {
            setSimulatedRainfall(125);
            setEscalationStep('Warning Alert: 125mm Rainfall (HIGH Risk)...');
            playAlertTone(false);
          }, 6500);

          const t3 = setTimeout(() => {
            setSimulatedRainfall(180);
            setEscalationStep('CRITICAL THRESHOLD: 180mm Rain (CRITICAL Hazard Level)!');
            playAlertTone(true);
            setShowEmergencyModal(true);
            setIsEscalating(false);
          }, 10500);

          return () => {
            clearTimeout(t1);
            clearTimeout(t2);
            clearTimeout(t3);
          };
        }, [isEscalating, playAlertTone]);

        const submitReport = useCallback(async (report) => {
          let aiNote = 'Automated assessment: Potential slope failure detected. Verified against regional rainfall thresholds.';
          if (report.hazardType === 'Road Crack') aiNote = 'Longitudinal tension crack pattern indicates nascent slope crest detachment.';
          else if (report.hazardType === 'Landslide') aiNote = 'Active mass wasting reported. Immediate barrier dispatch recommended.';

          const newRep = {
            ...report,
            id: `rep-${Date.now().toString().slice(-4)}`,
            timestamp: 'Just now',
            status: 'New',
            aiAssessment: aiNote
          };

          setCitizenReports((prev) => {
            const next = [newRep, ...prev];
            try {
              localStorage.setItem('ner_citizen_reports', JSON.stringify([newRep]));
            } catch(e){}
            return next;
          });
          return newRep;
        }, []);

        const updateReportStatus = useCallback((repId, status) => {
          setCitizenReports((prev) =>
            prev.map((r) => (r.id === repId ? { ...r, status } : r))
          );
        }, []);

        return (
          <SimulationContext.Provider
            value={{
              currentRoute,
              navigateTo,
              allZones: MOCK_ZONES,
              activeZone,
              setActiveZone,
              simulatedRainfall,
              setSimulatedRainfall,
              dynamicRiskScore: dynamicMetrics.riskScore,
              dynamicRiskLevel: dynamicMetrics.riskLevel,
              dynamicSoilMoisture: dynamicMetrics.soilMoisture,
              dynamicGroundDisplacement: dynamicMetrics.groundDisplacement,
              dynamicTrigger: dynamicMetrics.primaryTrigger,
              userCoords,
              locationStatus,
              locationMessage,
              requestUserLocation,
              isEscalating,
              escalationStep,
              runEscalationDemo,
              stopEscalationDemo: () => setIsEscalating(false),
              showEmergencyModal,
              setShowEmergencyModal,
              showSafeAreasModal,
              setShowSafeAreasModal,
              activeAlerts: MOCK_ALERTS,
              citizenReports,
              submitReport,
              updateReportStatus
            }}
          >
            {children}
          </SimulationContext.Provider>
        );
      }

        return useContext(SimulationContext);

      function RiskBadge({ level, size = 'md', showPulse = false }) {

      function RiskMap() {
        const { allZones, activeZone, setActiveZone, userCoords, navigateTo, setShowSafeAreasModal } = useSimulation();
        const mapRef = useRef(null);
        const mapInst = useRef(null);
        const [selectedZone, setSelectedZone] = useState(activeZone);
        const [filterLvl, setFilterLvl] = useState('ALL');
        const [isPanelOpen, setIsPanelOpen] = useState(true);

        const filtered = allZones.filter((z) => filterLvl === 'ALL' || z.riskLevel === filterLvl);

        useEffect(() => {
          if (!mapRef.current || typeof L === 'undefined' || mapInst.current) return;

          const map = L.map(mapRef.current, {
            center: [25.9, 92.8],
            zoom: 7,
            minZoom: 6,
            maxZoom: 14,
          });

          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            maxZoom: 19,
          }).addTo(map);

          mapInst.current = map;
        }, []);

        useEffect(() => {
          const map = mapInst.current;
          if (!map || typeof L === 'undefined') return;

          // Clear previous markers
          map.eachLayer((layer) => {
            if (layer instanceof L.CircleMarker || (layer instanceof L.Marker && layer.options.icon?.options?.className === 'custom-user-marker')) {
              map.removeLayer(layer);
            }
          });

          if (userCoords) {
            const userIcon = L.divIcon({
              className: 'custom-user-marker',

      // ==========================================
      // 4. AI ASSISTANT
      // ==========================================
      function AIAssistant() {
        const { activeZone, simulatedRainfall, dynamicRiskScore, dynamicRiskLevel, navigateTo } = useSimulation();
        const [messages, setMessages] = useState([
          {
            id: '1',
            sender: 'assistant',
            text: `Hello! I am the **NER Landslide AI Assistant**.\n\nI monitor geomechanical slope stability and precipitation thresholds across Northeast India.\n\nActive Context: **${activeZone.name}** (${dynamicRiskLevel} Risk • Score ${dynamicRiskScore}/100).\n\nHow can I help you?`
          }
        ]);
        const [input, setInput] = useState('');
        const [isTyping, setIsTyping] = useState(false);
        const endRef = useRef(null);

        const handleSend = (text) => {
          const q = (text || input).trim();
          if (!q) return;

          setMessages((prev) => [...prev, { id: Date.now().toString(), sender: 'user', text: q }]);
          setInput('');
          setIsTyping(true);

          setTimeout(() => {
            let reply = '';
            const qLower = q.toLowerCase();

            if (qLower.includes('why') && (qLower.includes('risk') || qLower.includes('high') || qLower.includes('critical'))) {
              reply = `${activeZone.name} is currently evaluated at **${dynamicRiskLevel} Risk (Score: ${dynamicRiskScore}/100)** in this prototype.\n\nKey triggers:\n• 24h Rainfall: ${simulatedRainfall} mm\n• Soil Moisture: ${activeZone.soilMoisture}%\n• Terrain Slope: ${activeZone.slope}° (${activeZone.soilType})\n• Ground Movement: ${activeZone.groundDisplacement} mm\n\nTrigger Note: ${activeZone.primaryTrigger}.`;
            } else if (qLower.includes('which areas') || qLower.includes('critical') || qLower.includes('most dangerous')) {
              reply = `Currently in this prototype, the following zones exhibit **CRITICAL** risk:\n\n• **Cherrapunji (Sohra) Escarpment** (Meghalaya) - 215mm rain\n• **Haflong Railway Section** (Assam) - 178mm rain\n• **Noney Tupul Corridor** (Manipur) - 195mm rain, 18.3mm movement\n• **Mangan Slide Zone** (Sikkim) - 184mm rain`;
            } else if (qLower.includes('factor') || qLower.includes('trigger')) {
              reply = `The four primary factors evaluated by the NER AI model are:\n\n1. **Rainfall Accumulation:** Cumulative water volume driving pore pressure.\n2. **Soil Moisture Saturation:** Loss of soil shear strength upon saturation.\n3. **Slope Gradient:** Steepness accelerating gravitational shear stress.\n4. **Inclinometer Displacement:** Active sub-surface deformation.`;
            } else if (qLower.includes('what should i do') || qLower.includes('safety') || qLower.includes('warning')) {
              reply = `Action Guide for ${dynamicRiskLevel} Alert in ${activeZone.name}:\n\n1. Avoid valley bottoms and steep cut-slopes.\n2. Prepare an emergency Go-Bag with documents and water.\n3. Check designated shelters (e.g. ${activeZone.safeEvacuationAreas[0]?.name || 'Local Community Hall'}).\n4. Follow instructions from local SDMA/SDRF teams. Toll-free helpline: **1070** or **1078**.`;
            } else {
              reply = `Regarding **${activeZone.name}**:\nCurrent status is **${dynamicRiskLevel}** (Score: ${dynamicRiskScore}/100) with ${simulatedRainfall}mm simulated rainfall and ${activeZone.soilMoisture}% moisture.\n\nAll AI responses are synthesized directly from prototype telemetry.`;
            }

            setMessages((prev) => [...prev, { id: (Date.now() + 1).toString(), sender: 'assistant', text: reply }]);
            setIsTyping(false);
          }, 500);
        };

        useEffect(() => {
          endRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages, isTyping]);

        return (
          <div className="min-h-[calc(100vh-4rem)] pb-24 bg-[#0B132B] text-slate-100 flex flex-col">
            <div className="mx-auto w-full max-w-4xl px-3 sm:px-6 lg:px-8 py-4 flex-1 flex flex-col">
              <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                <div>
                  <h1 className="text-xl sm:text-2xl font-black text-white flex items-center gap-2">
                    <span>🤖</span> NER AI Assistant
                  </h1>
                  <p className="text-xs text-slate-400">Ask about current landslide risk, triggers, and safety instructions.</p>
                </div>
                <span className="px-2.5 py-1 rounded bg-indigo-950/80 border border-indigo-700/50 text-[11px] font-mono text-indigo-300">
                  {activeZone.name.split(' (')[0]}
                </span>
              </div>

              <div className="rounded-xl bg-slate-900/90 border border-slate-800 p-2.5 mb-3 text-xs text-slate-400">
                ℹ️ <strong>Prototype Notice:</strong> AI responses are generated from simulated prototype data.
              </div>

              <div className="flex-1 overflow-y-auto space-y-3 p-4 rounded-2xl bg-slate-900/60 border border-slate-800 min-h-[380px] max-h-[55vh]">
                {messages.map((m) => (
                  <div key={m.id} className={`flex gap-2.5 ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    {m.sender === 'assistant' && <div className="h-8 w-8 rounded-lg bg-indigo-600/30 flex items-center justify-center shrink-0">🤖</div>}
                    <div className={`max-w-[85%] rounded-2xl p-3.5 text-xs sm:text-sm leading-relaxed ${m.sender === 'user' ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-slate-800 border border-slate-700 text-slate-200 rounded-tl-none'}`}>
                      <div className="whitespace-pre-line">{m.text}</div>
                    </div>
                  </div>
                ))}
                {isTyping && <div className="text-xs text-slate-400 font-mono animate-pulse">AI analyzing telemetry...</div>}
                <div ref={endRef} />
              </div>

              <div className="mt-3">
                <span className="text-[11px] font-semibold text-slate-400 block mb-1">Suggested Questions:</span>
                <div className="flex flex-wrap gap-1.5">
                  {[
                    'Why is my area at high risk?',
                    'Which areas are currently critical?',
                    'What factors are increasing the risk?',
                    'What should I do during a high-risk warning?'
                  ].map((q) => (
                    <button key={q} onClick={() => handleSend(q)} className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700">
                      {q}
                    </button>
                  ))}
                </div>
              </div>

              <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} className="mt-3 flex items-center gap-2">
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  placeholder={`Ask about ${activeZone.name.split(' (')[0]}...`}
                  className="flex-1 rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500"
                />
                <button type="submit" className="px-5 py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-md">
                  Send
                </button>
              </form>
            </div>
          </div>
        );
      }

                  </div>
                  <div className="bg-slate-900/80 p-3 rounded-xl border border-slate-800 space-y-1">
                    <span className="text-slate-400 font-semibold">📡 Ground Movement: {dynamicGroundDisplacement} mm</span>
                    <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                      <div className="h-full bg-orange-500" style={{ width: `${Math.min(100, dynamicGroundDisplacement * 5)}%` }}></div>
                    </div>
                  </div>
                </div>
              </div>

              {/* 2-Column Grid: Alerts & Environmental Telemetry */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* Active Alerts (Requirement #14) */}
                <div className="lg:col-span-5 space-y-4">
                  <div className="rounded-2xl bg-slate-900/90 border border-slate-800 p-5 shadow-xl">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                      <h3 className="text-sm font-black text-white uppercase tracking-wider flex items-center gap-2">
                        <span>📢</span> ACTIVE ALERTS
                      </h3>
                      <span className="text-xs font-mono text-slate-400">{activeAlerts.length} Broadcasted</span>
                    </div>

                    <div className="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
                      {activeAlerts.map((alt) => (
                        <div
                          key={alt.id}
                          onClick={() => {
                            const z = allZones.find(x => x.id === alt.zoneId);
                            if (z) setActiveZone(z);
                          }}
                          className="rounded-xl p-3.5 bg-slate-800/60 border border-slate-700 hover:border-blue-500 cursor-pointer transition-all"
                        >
                          <div className="flex justify-between items-start">
                            <span className="font-bold text-xs text-white">{alt.headline}</span>
                          </div>
                          <p className="text-xs text-slate-300 mt-1.5 leading-relaxed">{alt.description}</p>
                          <div className="mt-2 text-[10px] text-slate-400 font-mono">Issued: {alt.issuedAt} • Pop: ~{alt.affectedPopulation.toLocaleString()}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Monitored Zones Matrix */}
                  <div className="rounded-2xl bg-slate-900/90 border border-slate-800 p-5 shadow-xl">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
                      <h3 className="text-sm font-bold text-white">Monitoring Registry</h3>
                      <div className="flex gap-1 text-[10px]">
                        {['ALL', 'CRITICAL', 'HIGH'].map((l) => (
                          <button
                            key={l}
                            onClick={() => setFilterLvl(l)}
                            className={`px-2 py-0.5 rounded font-bold ${filterLvl === l ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}
                          >
                            {l}
                          </button>
                        ))}
                      </div>
                    </div>
                    <div className="space-y-1.5 max-h-48 overflow-y-auto pr-1 text-xs">
                      {allZones.filter(z => filterLvl === 'ALL' || z.riskLevel === filterLvl).slice(0, 7).map((z) => (
                        <div
                          key={z.id}
                          onClick={() => setActiveZone(z)}
                          className="p-2 rounded-lg bg-slate-800/50 border border-slate-700 flex justify-between items-center cursor-pointer hover:bg-slate-800"
                        >
                          <div>
                            <span className="font-bold text-slate-200">{z.name.split(' (')[0]}</span>
                            <span className="text-[10px] text-slate-400 block">{z.state} • {z.rainfall24h}mm rain</span>
                          </div>
                          <RiskBadge level={z.riskLevel} size="sm" />
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Right: Telemetry Charts & Reports */}
                <div className="lg:col-span-7 space-y-6">
                  {/* Environmental Monitoring Charts (Requirement #16) */}
                  <div className="rounded-2xl bg-slate-900/90 border border-slate-800 p-5 shadow-xl space-y-4">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                      <div>
                        <h3 className="text-sm font-bold text-white flex items-center gap-2">
                          <span>📈</span> Environmental Telemetry Time-Series
                        </h3>
                        <p className="text-xs text-slate-400">Station: {activeZone.name.split(' (')[0]}</p>
                      </div>
                      <div className="flex gap-1 bg-slate-800 p-1 rounded-lg text-xs">
                        {['24h', '7d', '30d'].map((r) => (
                          <button
                            key={r}
                            onClick={() => setTimeRange(r)}
                            className={`px-2 py-1 rounded font-bold ${timeRange === r ? 'bg-blue-600 text-white' : 'text-slate-400'}`}
                          >
                            {r.toUpperCase()}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {/* Rainfall Chart */}
                      <div className="rounded-xl bg-slate-800/60 p-3.5 border border-slate-700 space-y-2">
                        <div className="flex justify-between text-xs">
                          <span className="font-bold text-white">🌧️ Rainfall (mm)</span>
                          <span className="font-mono text-blue-400 font-bold">{simulatedRainfall} mm</span>
                        </div>
                        <div className="h-28 flex items-end justify-between gap-1 pt-3 pb-1 border-b border-slate-700">
                          {sampleRainfall.map((val, i) => (
                            <div key={i} className="flex-1 flex flex-col items-center h-full justify-end">
                              <div
                                className="w-full bg-blue-500 rounded-t transition-all"
                                style={{ height: `${Math.max(10, Math.min(100, (val / 200) * 100))}%` }}
                              />
                              <span className="text-[9px] text-slate-400 mt-1">{seriesHours[i]}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Soil Moisture Chart */}
                      <div className="rounded-xl bg-slate-800/60 p-3.5 border border-slate-700 space-y-2">
                        <div className="flex justify-between text-xs">
                          <span className="font-bold text-white">💧 Soil Moisture (%)</span>
                          <span className="font-mono text-teal-400 font-bold">{dynamicSoilMoisture}%</span>
                        </div>
                        <div className="h-28 flex items-end justify-between gap-1 pt-3 pb-1 border-b border-slate-700">
                          {[55, 62, 68, 74, 79, 81, dynamicSoilMoisture].map((val, i) => (
                            <div key={i} className="flex-1 flex flex-col items-center h-full justify-end">
                              <div
                                className="w-full bg-teal-500 rounded-t transition-all"
                                style={{ height: `${val}%` }}
                              />
                              <span className="text-[9px] text-slate-400 mt-1">{seriesHours[i]}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Movement Chart */}
                      <div className="rounded-xl bg-slate-800/60 p-3.5 border border-slate-700 space-y-2">
                        <div className="flex justify-between text-xs">
                          <span className="font-bold text-white">📡 Ground Movement (mm)</span>
                          <span className="font-mono text-orange-400 font-bold">{dynamicGroundDisplacement} mm</span>
                        </div>
                        <div className="h-28 flex items-end justify-between gap-1 pt-3 pb-1 border-b border-slate-700">
                          {[1.2, 1.8, 2.5, 3.8, 5.2, 6.4, dynamicGroundDisplacement].map((val, i) => (
                            <div key={i} className="flex-1 flex flex-col items-center h-full justify-end">
                              <div
                                className="w-full bg-orange-500 rounded-t transition-all"
                                style={{ height: `${Math.min(100, val * 6)}%` }}
                              />
                              <span className="text-[9px] text-slate-400 mt-1">{seriesHours[i]}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Risk Score Chart */}
                      <div className="rounded-xl bg-slate-800/60 p-3.5 border border-slate-700 space-y-2">
                        <div className="flex justify-between text-xs">
                          <span className="font-bold text-white">⚡ Landslide Risk Index</span>
                          <span className="font-mono text-red-400 font-bold">{dynamicRiskScore}/100</span>
                        </div>
                        <div className="h-28 flex items-end justify-between gap-1 pt-3 pb-1 border-b border-slate-700">
                          {[38, 44, 55, 64, 72, 78, dynamicRiskScore].map((val, i) => (
                            <div key={i} className="flex-1 flex flex-col items-center h-full justify-end">
                              <div
                                className={`w-full rounded-t transition-all ${val >= 85 ? 'bg-red-500' : val >= 65 ? 'bg-orange-500' : 'bg-emerald-500'}`}
                                style={{ height: `${val}%` }}
                              />
                              <span className="text-[9px] text-slate-400 mt-1">{seriesHours[i]}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Citizen Reports Review Queue (Requirement #15) */}
                  <div className="rounded-2xl bg-slate-900/90 border border-slate-800 p-5 shadow-xl space-y-3">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                      <h3 className="text-sm font-bold text-white flex items-center gap-2">
                        <span>🚨</span> Citizen Hazard Reports Queue ({citizenReports.length})
                      </h3>
                    </div>
                    <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                      {citizenReports.map((rep) => (
                        <div key={rep.id} className="p-3 rounded-xl bg-slate-800/70 border border-slate-700 text-xs space-y-1.5">
                          <div className="flex justify-between items-start">
                            <span className="font-bold text-white">{rep.hazardType} — {rep.locationName}</span>
                            <select
                              value={rep.status}
                              onChange={(e) => updateReportStatus(rep.id, e.target.value)}
                              className="bg-slate-900 border border-slate-700 text-slate-200 text-[11px] rounded px-2 py-1 outline-none font-bold"
                            >
                              <option value="New">New</option>
                              <option value="Under Review">Under Review</option>
                              <option value="Verified">Verified</option>
                              <option value="Resolved">Resolved</option>
                            </select>
                          </div>
                          <p className="text-slate-300">"{rep.description}"</p>
                          <div className="text-[10px] text-slate-400 font-mono">
                            AI note: {rep.aiAssessment} • Status: <strong className="text-amber-300">{rep.status}</strong>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // 7. SAFETY GUIDE & HELPLINES
      // ==========================================
      function SafetyGuide() {
        const [tab, setTab] = useState('protocols');

        return (
          <div className="min-h-[calc(100vh-4rem)] pb-24 bg-[#0B132B] text-slate-100">
            <div className="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8 py-6 space-y-6">
              <div className="border-b border-slate-800 pb-4">
                <h1 className="text-2xl sm:text-3xl font-black text-white flex items-center gap-2">
                  <span>🛡️</span> Landslide Safety Guide
                </h1>
                <p className="text-xs sm:text-sm text-slate-300 mt-1">Official disaster preparedness guidelines according to NDMA and GSI protocols.</p>
              </div>

              <div className="flex border-b border-slate-800">
                <button
                  onClick={() => setTab('protocols')}
                  className={`py-2 px-4 text-xs font-bold border-b-2 ${tab === 'protocols' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400'}`}
                >
                  Safety Protocols
                </button>
                <button
                  onClick={() => setTab('contacts')}
                  className={`py-2 px-4 text-xs font-bold border-b-2 ${tab === 'contacts' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400'}`}
                >
                  8 NE State Helplines
                </button>
              </div>

              {tab === 'protocols' ? (
                <div className="space-y-4">
                  <div className="rounded-2xl bg-slate-900/90 border border-slate-800 p-5 space-y-2">
                    <h3 className="text-sm font-bold text-emerald-400 flex items-center gap-1.5">🟢 Before a Landslide</h3>
                    <ul className="text-xs text-slate-300 space-y-1.5 list-disc pl-5">
                      <li>Monitor official warnings from local disaster management authorities.</li>
                      <li>Avoid building or residing on steep cut-slopes during heavy continuous rainfall.</li>
                      <li>Know your community evacuation routes and nearest designated emergency shelters.</li>
                      <li>Keep emergency kits ready (torches, radios, first-aid, potable water).</li>
                    </ul>
                  </div>

                  <div className="rounded-2xl bg-slate-900/90 border border-orange-800 p-5 space-y-2">
                    <h3 className="text-sm font-bold text-orange-400 flex items-center gap-1.5">🟠 During a Landslide</h3>
                    <ul className="text-xs text-slate-300 space-y-1.5 list-disc pl-5">
                      <li>Move away from the slide path quickly across the slope, not downhill.</li>
                      <li>Avoid crossing swollen hill streams and muddy debris flows.</li>
                      <li>Follow official evacuation instructions issued by district magistrates and SDRF teams.</li>
                      <li>Stay away from cracked roads and unstable highway shoulders.</li>
                    </ul>
                  </div>

                  <div className="rounded-2xl bg-slate-900/90 border border-red-800 p-5 space-y-2">
                    <h3 className="text-sm font-bold text-red-400 flex items-center gap-1.5">🔴 After a Landslide</h3>
                    <ul className="text-xs text-slate-300 space-y-1.5 list-disc pl-5">
                      <li>Avoid unstable debris fields and watch for secondary slide triggers.</li>
                      <li>Report new road cracks and hazards using this application.</li>
                      <li>Do not enter damaged structures until certified safe by civil authorities.</li>
                      <li>Follow authority instructions and emergency broadcast advisories.</li>
                    </ul>
                  </div>
                </div>
              ) : (
                <div className="space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {EMERGENCY_CONTACTS.map((c, idx) => (
                      <div key={idx} className="rounded-xl bg-slate-900/80 border border-slate-800 p-3.5 space-y-1 text-xs">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-white">{c.state}</span>
                          <span className="font-mono text-emerald-400 font-bold">{c.helpline}</span>
                        </div>
                        <p className="text-slate-400 text-[11px]">{c.authority}</p>
                        <p className="text-slate-500 font-mono text-[10px]">Landline: {c.alt}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ==========================================
      // ROOT APP ROUTER
      // ==========================================
      function AppContent() {
        const { currentRoute } = useSimulation();

        const renderView = () => {
          switch (currentRoute) {
            case '/dashboard': return <CitizenDashboard />;
            case '/map': return <RiskMap />;
            case '/ai-assistant': return <AIAssistant />;
            case '/report': return <HazardReportForm />;
            case '/authority': return <AuthorityDashboard />;
            case '/safety': return <SafetyGuide />;
            case '/':
            default:
              return <LandingPage />;
          }
        };

        return (
          <div className="flex min-h-screen flex-col bg-[#0B132B] font-sans antialiased text-slate-100">
            <Header />
            <EmergencyBanner />
            <main className="flex-1 w-full">{renderView()}</main>
            <Navigation />
          </div>
        );
      }

      function App() {
        return (
          <SimulationProvider>
            <AppContent />
          </SimulationProvider>
        );
      }

      // Render App to DOM
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    </script>
  </body>
</html>
